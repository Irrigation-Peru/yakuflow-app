# El sitio que compila Vite y, en el mismo origen, la API. Así la cookie de sesión funciona sin CORS, igual que con el
# proxy de Vite en desarrollo (apps/web/vite.config.ts).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # El wasm del modelo de cultivos pesa 14 MB; comprimido baja a una fracción.
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # La API confía en un intermediario (trust proxy 1 en producción) y toma de aquí la IP del estudiante, que usa
    # el límite de intentos al entrar.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Express acepta hasta 256 kB de JSON; lo que pase de eso lo rechaza la API con su propio mensaje.
    client_max_body_size 1m;
  }

  # Los archivos de Vite llevan su huella en el nombre: se pueden guardar un año. index.html no.
  location /assets/ {
    include /etc/nginx/cabeceras.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/cabeceras.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}

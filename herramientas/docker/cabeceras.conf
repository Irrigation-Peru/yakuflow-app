# Las mismas cabeceras que el sitio lleva en Render (render.yaml). Van en cada location porque nginx deja de heredar
# las de arriba en cuanto una location agrega las suyas.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
